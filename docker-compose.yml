version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.fullstack
      target: production
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
    depends_on:
      - database
    command: ["node", "backend/dist/main"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.fullstack
      target: production
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    depends_on:
      - backend
    command: ["nginx", "-g", "daemon off;"]

  database:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=monorepo
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
