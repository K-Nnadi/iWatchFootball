# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  timeoutSeconds: 600  # Request timeout (max 3600s, startup timeout is fixed at 4min)
  cpuBoost: true  # Enable CPU boost during startup for faster initialization

# Environment variables and secrets.
# Note: Database connection uses Cloud SQL socket automatically detected by K_SERVICE
