name: I Watch Football CI/CD

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'clients/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'clients/**'
  workflow_dispatch:  # Manual trigger

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [backend, frontend, clients]
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Dependencies
        run: pnpm install

      - name: Build ${{ matrix.package }}
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.changed_files, matrix.package)
        run: pnpm --filter ${{ matrix.package }} build

      - name: Run Tests
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.changed_files, matrix.package)
        run: pnpm --filter ${{ matrix.package }} test

  deploy-backend:
    needs: ci
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Dependencies
        run: pnpm install

      - name: Build Backend
        run: pnpm --filter backend build

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west4-docker.pkg.dev

      - name: Ensure Cloud Run service account has Cloud SQL Client role
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
        run: |
          set -euo pipefail
          CLOUD_SQL_CONNECTION="${GCP_PROJECT_ID}:europe-west4:iwatchfootball-db"

          # APIs must already be enabled on the project (deploy SA lacks serviceusage.services.enable).
          gcloud sql instances describe iwatchfootball-db --project="${GCP_PROJECT_ID}" \
            || { echo "Cloud SQL instance not found: ${CLOUD_SQL_CONNECTION}"; exit 1; }

          PROJECT_NUMBER=$(gcloud projects describe "${GCP_PROJECT_ID}" --format="value(projectNumber)")
          DEFAULT_SA="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"

          grant_cloudsql_client() {
            gcloud projects add-iam-policy-binding "${GCP_PROJECT_ID}" \
              --member="serviceAccount:$1" \
              --role="roles/cloudsql.client" \
              --condition=None || true
          }

          grant_cloudsql_client "${DEFAULT_SA}"

          EXISTING_SA=$(gcloud run services describe iwatchfootball-backend \
            --region="${GCP_REGION}" \
            --project="${GCP_PROJECT_ID}" \
            --format='value(spec.template.spec.serviceAccountName)' 2>/dev/null || true)
          if [ -n "${EXISTING_SA}" ] && [ "${EXISTING_SA}" != "${DEFAULT_SA}" ]; then
            grant_cloudsql_client "${EXISTING_SA}"
            echo "Cloud SQL Client role verified for Cloud Run service account: ${EXISTING_SA}"
          fi

          echo "Cloud SQL Client role verified for default service account: ${DEFAULT_SA}"
          echo "Cloud SQL connection: ${CLOUD_SQL_CONNECTION}"

      - name: Build and push Docker image
        run: |
          docker build -f backend/Dockerfile -t europe-west4-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/iwatchfootball-backend/iwatchfootball-backend:${{ github.sha }} .
          docker push europe-west4-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/iwatchfootball-backend/iwatchfootball-backend:${{ github.sha }}

      - name: Deploy to Cloud Run
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          VPC_CONNECTOR: ${{ secrets.VPC_CONNECTOR }}
        run: |
          set -euo pipefail
          CLOUD_SQL_CONNECTION="${GCP_PROJECT_ID}:europe-west4:iwatchfootball-db"
          DATABASE_HOST="/cloudsql/${CLOUD_SQL_CONNECTION}"

          DEPLOY_ARGS=(
            --project "${GCP_PROJECT_ID}"
            --image "europe-west4-docker.pkg.dev/${GCP_PROJECT_ID}/iwatchfootball-backend/iwatchfootball-backend:${{ github.sha }}"
            --platform managed
            --region "${GCP_REGION}"
            --allow-unauthenticated
            --port 8080
            --memory 1Gi
            --cpu 1
            --min-instances 0
            --max-instances 10
            --timeout 600
            --cpu-boost
            --add-cloudsql-instances "${CLOUD_SQL_CONNECTION}"
            --set-env-vars NODE_ENV=production
            --set-env-vars "DATABASE_HOST=${DATABASE_HOST}"
            --set-env-vars "CLOUD_SQL_CONNECTION_NAME=${CLOUD_SQL_CONNECTION}"
            --set-env-vars "GCP_PROJECT_ID=${GCP_PROJECT_ID}"
            --set-env-vars DATABASE_USERNAME="${DATABASE_USERNAME}"
            --set-env-vars DATABASE_PASSWORD="${DATABASE_PASSWORD}"
            --set-env-vars DATABASE_NAME=iwatchfootball
            --set-env-vars DATABASE_TYPE=postgres
            --set-env-vars DATABASE_SYNCHRONIZE=false
          )

          if [ -n "${REDIS_HOST:-}" ]; then
            DEPLOY_ARGS+=(--set-env-vars "REDIS_HOST=${REDIS_HOST}")
            DEPLOY_ARGS+=(--set-env-vars "REDIS_PORT=${REDIS_PORT:-6379}")
            if [ -n "${REDIS_PASSWORD:-}" ]; then
              DEPLOY_ARGS+=(--set-env-vars "REDIS_PASSWORD=${REDIS_PASSWORD}")
            fi
          fi

          if [ -n "${VPC_CONNECTOR:-}" ]; then
            DEPLOY_ARGS+=(--vpc-connector "${VPC_CONNECTOR}")
            DEPLOY_ARGS+=(--vpc-egress private-ranges-only)
          fi

          gcloud run deploy iwatchfootball-backend "${DEPLOY_ARGS[@]}"


  deploy-frontend:
    needs: ci
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 8

      # ✅ Cache PNPM store (extra optimization)
      - name: Restore PNPM store from cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install
        working-directory: frontend/ui

      - name: Build frontend
        run: pnpm run build
        working-directory: frontend/ui

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_IWATCHFOOTBALL }}'
          channelId: live
          projectId: '${{ secrets.FIREBASE_PROJECT_ID }}'
          entryPoint: frontend/ui

  post-deploy:
    needs: [deploy-backend, deploy-frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Notify deployment complete
        run: echo "All services deployed successfully"
