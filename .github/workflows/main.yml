name: I Watch Football CI/CD

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'clients/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'clients/**'
  workflow_dispatch:  # Manual trigger

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [backend, frontend, clients]
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Dependencies
        run: pnpm install

      - name: Build ${{ matrix.package }}
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.changed_files, matrix.package)
        run: pnpm --filter ${{ matrix.package }} build

      - name: Run Tests
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.changed_files, matrix.package)
        run: pnpm --filter ${{ matrix.package }} test

  deploy-backend:
    needs: ci
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Dependencies
        run: pnpm install

      - name: Build Backend
        run: pnpm --filter backend build

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to use gcloud as a credential helper
        run: gcloud auth configure-docker

      - name: Build and push Docker image
        run: |
          docker build -f backend/Dockerfile -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/iwatchfootball-backend:${{ github.sha }} .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/iwatchfootball-backend:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy iwatchfootball-backend \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/iwatchfootball-backend:${{ github.sha }} \
            --platform managed \
            --region ${{ secrets.GCP_REGION }} \
            --allow-unauthenticated \
            --port 3000 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --set-env-vars NODE_ENV=production \
            --set-env-vars DATABASE_HOST=${{ secrets.DATABASE_HOST }} \
            --set-env-vars DATABASE_PORT=${{ secrets.DATABASE_PORT }} \
            --set-env-vars DATABASE_USERNAME=${{ secrets.DATABASE_USERNAME }} \
            --set-env-vars DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }} \
            --set-env-vars DATABASE_NAME=${{ secrets.DATABASE_NAME }} \
            --set-env-vars DATABASE_TYPE=${{ secrets.DATABASE_TYPE }} \
            --set-env-vars DATABASE_SYNCHRONIZE=${{ secrets.DATABASE_SYNCHRONIZE }}


  deploy-frontend:
    needs: ci
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Dependencies
        run: pnpm install

      - name: Build Frontend
        run: pnpm --filter frontend/ui build

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_IWATCHFOOTBALL }}'
          channelId: live
          projectId: '${{ secrets.FIREBASE_PROJECT_ID }}'
          entryPoint: frontend/ui

  post-deploy:
    needs: [deploy-backend, deploy-frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Notify deployment complete
        run: echo "All services deployed successfully"
