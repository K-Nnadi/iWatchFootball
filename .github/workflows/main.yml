name: I Watch Football CI/CD

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'clients/**'
      - 'libraries/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'clients/**'
      - 'libraries/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:  # Manual trigger

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ['./backend', './frontend/ui', './clients']
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Dependencies
        run: pnpm install

      - name: Build shared libraries
        run: pnpm --filter @iWatchFootball/base-tools build

      - name: Build ${{ matrix.package }}
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.changed_files, matrix.package)
        run: pnpm --filter ${{ matrix.package }} build

      - name: Run Tests
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.changed_files, matrix.package)
        run: pnpm --filter ${{ matrix.package }} test

  deploy-backend:
    needs: ci
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Dependencies
        run: pnpm install

      - name: Build Backend
        run: pnpm --filter ./backend build

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west4-docker.pkg.dev

      - name: Ensure Cloud Run service account has Cloud SQL Client role
        continue-on-error: true
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
          CLOUD_SQL_CONNECTION_NAME: ${{ secrets.CLOUD_SQL_CONNECTION_NAME }}
        run: |
          set -euo pipefail
          CLOUD_SQL_CONNECTION="${CLOUD_SQL_CONNECTION_NAME:-${GCP_PROJECT_ID}:europe-west4:iwatchfootball-db}"
          SQL_PROJECT="${CLOUD_SQL_CONNECTION%%:*}"
          SQL_TAIL="${CLOUD_SQL_CONNECTION#*:}"
          SQL_REGION="${SQL_TAIL%%:*}"
          CLOUD_SQL_INSTANCE="${CLOUD_SQL_CONNECTION##*:}"

          echo "Cloud SQL connection: ${CLOUD_SQL_CONNECTION}"

          if ! gcloud sql instances describe "${CLOUD_SQL_INSTANCE}" \
            --project="${SQL_PROJECT}" 2>/dev/null; then
            echo "::warning::Cloud SQL instance not found (${CLOUD_SQL_CONNECTION}). Skipping IAM bootstrap — set CLOUD_SQL_CONNECTION_NAME secret if the name differs."
            exit 0
          fi

          PROJECT_NUMBER=$(gcloud projects describe "${SQL_PROJECT}" --format="value(projectNumber)")
          DEFAULT_SA="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"

          grant_cloudsql_client() {
            gcloud projects add-iam-policy-binding "${SQL_PROJECT}" \
              --member="serviceAccount:$1" \
              --role="roles/cloudsql.client" \
              --condition=None || true
          }

          grant_cloudsql_client "${DEFAULT_SA}"

          EXISTING_SA=$(gcloud run services describe iwatchfootball-backend \
            --region="${GCP_REGION}" \
            --project="${GCP_PROJECT_ID}" \
            --format='value(spec.template.spec.serviceAccountName)' 2>/dev/null || true)
          if [ -n "${EXISTING_SA}" ] && [ "${EXISTING_SA}" != "${DEFAULT_SA}" ]; then
            grant_cloudsql_client "${EXISTING_SA}"
            echo "Cloud SQL Client role verified for Cloud Run service account: ${EXISTING_SA}"
          fi

          echo "Cloud SQL Client role verified for default service account: ${DEFAULT_SA}"

      - name: Build and push Docker image
        run: |
          docker build -f backend/Dockerfile -t europe-west4-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/iwatchfootball-backend/iwatchfootball-backend:${{ github.sha }} .
          docker push europe-west4-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/iwatchfootball-backend/iwatchfootball-backend:${{ github.sha }}

      - name: Deploy to Cloud Run
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLOUD_SQL_CONNECTION_NAME: ${{ secrets.CLOUD_SQL_CONNECTION_NAME }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          VPC_CONNECTOR: ${{ secrets.VPC_CONNECTOR }}
        run: |
          set -euo pipefail
          CLOUD_SQL_CONNECTION="${CLOUD_SQL_CONNECTION_NAME:-${GCP_PROJECT_ID}:europe-west4:iwatchfootball-db}"
          DATABASE_HOST="/cloudsql/${CLOUD_SQL_CONNECTION}"

          echo "Deploying with Cloud SQL connection: ${CLOUD_SQL_CONNECTION}"

          # YAML single-quoted values safely handle secrets with &, %, ?, etc.
          yaml_quote() {
            printf "'%s'" "$(printf '%s' "$1" | sed "s/'/''/g")"
          }

          {
            echo "NODE_ENV: production"
            echo "DATABASE_HOST: $(yaml_quote "${DATABASE_HOST}")"
            echo "CLOUD_SQL_CONNECTION_NAME: $(yaml_quote "${CLOUD_SQL_CONNECTION}")"
            echo "GCP_PROJECT_ID: $(yaml_quote "${GCP_PROJECT_ID}")"
            echo "DATABASE_USERNAME: $(yaml_quote "${DATABASE_USERNAME}")"
            echo "DATABASE_PASSWORD: $(yaml_quote "${DATABASE_PASSWORD}")"
            echo "DATABASE_NAME: iwatchfootball"
            echo "DATABASE_TYPE: postgres"
            echo "DATABASE_SYNCHRONIZE: \"false\""
            echo "JWT_SECRET: $(yaml_quote "${JWT_SECRET}")"
            if [ -n "${REDIS_HOST:-}" ]; then
              echo "REDIS_HOST: $(yaml_quote "${REDIS_HOST}")"
              echo "REDIS_PORT: $(yaml_quote "${REDIS_PORT:-6379}")"
              if [ -n "${REDIS_PASSWORD:-}" ]; then
                echo "REDIS_PASSWORD: $(yaml_quote "${REDIS_PASSWORD}")"
              fi
            fi
          } > cloud-run-env.yaml

          DEPLOY_ARGS=(
            --project "${GCP_PROJECT_ID}"
            --image "europe-west4-docker.pkg.dev/${GCP_PROJECT_ID}/iwatchfootball-backend/iwatchfootball-backend:${{ github.sha }}"
            --platform managed
            --region "${GCP_REGION}"
            --allow-unauthenticated
            --port 8080
            --memory 1Gi
            --cpu 1
            --min-instances 0
            --max-instances 10
            --timeout 600
            --cpu-boost
            --set-cloudsql-instances "${CLOUD_SQL_CONNECTION}"
            --env-vars-file cloud-run-env.yaml
          )

          if [ -n "${VPC_CONNECTOR:-}" ]; then
            DEPLOY_ARGS+=(--vpc-connector "${VPC_CONNECTOR}")
            DEPLOY_ARGS+=(--vpc-egress private-ranges-only)
          fi

          gcloud run deploy iwatchfootball-backend "${DEPLOY_ARGS[@]}"

          ATTACHED_SQL=$(gcloud run services describe iwatchfootball-backend \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format='value(spec.template.metadata.annotations."run.googleapis.com/cloudsql-instances")')
          echo "Attached Cloud SQL instances: ${ATTACHED_SQL:-<none>}"
          if [ "${ATTACHED_SQL}" != "${CLOUD_SQL_CONNECTION}" ]; then
            echo "::error::Cloud SQL instance not attached to revision (expected ${CLOUD_SQL_CONNECTION})"
            exit 1
          fi


  deploy-frontend:
    needs: ci
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 8

      # ✅ Cache PNPM store (extra optimization)
      - name: Restore PNPM store from cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install
        working-directory: frontend/ui

      - name: Build frontend
        run: pnpm run build
        working-directory: frontend/ui

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_IWATCHFOOTBALL }}'
          channelId: live
          projectId: '${{ secrets.FIREBASE_PROJECT_ID }}'
          entryPoint: frontend/ui

  post-deploy:
    needs: [deploy-backend, deploy-frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Notify deployment complete
        run: echo "All services deployed successfully"
