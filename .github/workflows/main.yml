name: I Watch Football CI/CD

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'clients/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'clients/**'
  workflow_dispatch:  # Manual trigger

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [backend, frontend, clients]
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Dependencies
        run: pnpm install

      - name: Build ${{ matrix.package }}
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.changed_files, matrix.package)
        run: pnpm --filter ${{ matrix.package }} build

      - name: Run Tests
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.changed_files, matrix.package)
        run: pnpm --filter ${{ matrix.package }} test

  deploy-backend:
    needs: ci
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Dependencies
        run: pnpm install

      - name: Build Backend
        run: pnpm --filter backend build

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west4-docker.pkg.dev


      - name: Build and push Docker image
        run: |
          docker build -f backend/Dockerfile -t europe-west4-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/iwatchfootball-backend/iwatchfootball-backend:${{ github.sha }} .
          docker push europe-west4-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/iwatchfootball-backend/iwatchfootball-backend:${{ github.sha }}

      # 🔍 DEBUG — Check region value
      - name: Debug Region Value
        run: echo "GCP_REGION => '${{ secrets.GCP_REGION }}'"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy iwatchfootball-backend \
            --image europe-west4-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/iwatchfootball-backend/iwatchfootball-backend:${{ github.sha }} \
            --platform managed \
            --region ${{ secrets.GCP_REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --timeout 600 \
            --cpu-boost \
            --add-cloudsql-instances iwatchfootball:europe-west4:iwatchfootball-db \
            --set-env-vars NODE_ENV=production \
            --set-env-vars DATABASE_USERNAME=${{ secrets.DATABASE_USERNAME }} \
            --set-env-vars DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }} \
            --set-env-vars DATABASE_NAME=iwatchfootball \
            --set-env-vars DATABASE_TYPE=postgres \
            --set-env-vars DATABASE_SYNCHRONIZE=false


  deploy-frontend:
    needs: ci
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 8

      # ✅ Cache PNPM store (extra optimization)
      - name: Restore PNPM store from cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install
        working-directory: frontend/ui

      - name: Build frontend
        run: pnpm run build
        working-directory: frontend/ui

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_IWATCHFOOTBALL }}'
          channelId: live
          projectId: '${{ secrets.FIREBASE_PROJECT_ID }}'
          entryPoint: frontend/ui

  post-deploy:
    needs: [deploy-backend, deploy-frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Notify deployment complete
        run: echo "All services deployed successfully"
